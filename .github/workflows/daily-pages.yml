name: Daily Taiwan Stocks
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '更新模式'
        required: true
        default: intraday
        type: choice
        options: [intraday, daily]
  push:
    branches: [main]
    paths: ['pages/**', 'scripts/build_pages.py', 'scripts/screen_tw_pullback.py', 'scripts/fetch_tw_stock_data.py', 'scripts/test_tw_daily_update.py', 'scripts/test_build_pages.py', 'src/**', 'data/prob_models.json', 'data/score_calibration.json', 'requirements-pages.txt', '.github/workflows/daily-pages.yml']
  schedule:
    # 11:30 Asia/Taipei: intraday screen before the midday session.
    - cron: '30 3 * * 1-5'
    # 16:30 Asia/Taipei, Monday-Friday. Holidays use the latest complete day.
    - cron: '30 8 * * 1-5'
permissions:
  contents: read
concurrency:
  group: taiwan-stock-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-pages.txt
      - run: pip install -r requirements-pages.txt
      - run: python -m unittest scripts.test_tw_daily_update scripts.test_build_pages -v
      - uses: actions/cache/restore@v4
        with:
          path: .cache/official_daily_v1
          key: tw-market-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tw-market-v1-
      - name: Build noon intraday page
        if: github.event.schedule == '30 3 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'intraday')
        run: |
          for attempt in 1 2 3; do
            if python -u scripts/build_pages.py --mode intraday; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::盤中更新連續失敗 3 次"
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::盤中資料來源暫時失敗，${delay} 秒後進行第 $((attempt + 1)) 次嘗試"
            sleep "$delay"
          done
      - name: Build completed daily page
        if: github.event.schedule != '30 3 * * 1-5' && !(github.event_name == 'workflow_dispatch' && inputs.mode == 'intraday')
        run: |
          for attempt in 1 2 3; do
            if python -u scripts/build_pages.py --mode daily; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::收盤更新連續失敗 3 次"
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::歷史資料來源暫時失敗，${delay} 秒後進行第 $((attempt + 1)) 次嘗試"
            sleep "$delay"
          done
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/official_daily_v1
          key: tw-market-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
